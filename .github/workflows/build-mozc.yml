name: Build Mozc artifacts

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build-mozc-android.sh"
      - ".github/workflows/build-mozc.yml"

permissions:
  contents: read

concurrency:
  group: build-mozc-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-mozc:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout Mozc
        uses: actions/checkout@v4
        with:
          repository: google/mozc
          path: third_party/mozc

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential unzip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Restore Mozc dependency cache
        uses: actions/cache@v4
        with:
          path: third_party/mozc/src/third_party_cache
          key: mozc-update-deps-${{ runner.os }}-${{ hashFiles('third_party/mozc/src/build_tools/update_deps.py') }}

      - name: Download Mozc build dependencies
        working-directory: third_party/mozc/src
        run: python3 build_tools/update_deps.py

      - name: Build Mozc for Android
        env:
          SKIP_UPDATE_DEPS: "1"
        run: |
          chmod +x scripts/build-mozc-android.sh
          ./scripts/build-mozc-android.sh third_party/mozc/src

      - name: Upload Mozc artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mozc-android
          path: |
            mozc-engine/src/main/jniLibs/**/libmozc.so
            mozc-engine/src/main/assets/mozc.data

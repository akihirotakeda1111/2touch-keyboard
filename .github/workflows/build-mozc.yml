name: Build Mozc dependency

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - mozc.lock.json
      - scripts/build-mozc-android.sh
      - scripts/mozc_artifact.py
      - .github/workflows/build-mozc.yml
      - mozc-engine/src/main/proto/**
      - mozc-engine/src/main/java/com/google/**

permissions:
  contents: read

jobs:
  identify:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.lock.outputs.tag }}
      commit: ${{ steps.lock.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - id: lock
        run: python3 scripts/mozc_artifact.py identity

  build:
    needs: identify
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    concurrency:
      group: mozc-dependency-${{ needs.identify.outputs.tag }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MOZC_TAG: ${{ needs.identify.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for already published dependency
        id: existing
        run: |
          if gh release view "$MOZC_TAG" --json isDraft > "$RUNNER_TEMP/mozc-release.json"; then
            if jq -e '.isDraft == false' "$RUNNER_TEMP/mozc-release.json" >/dev/null; then
              echo 'published=true' >> "$GITHUB_OUTPUT"
              mkdir -p build/mozc
              gh release download "$MOZC_TAG" --pattern 'mozc-android.zip*' --dir build/mozc
              python3 scripts/mozc_artifact.py verify
            fi
          fi
      - name: Checkout pinned Mozc
        if: steps.existing.outputs.published != 'true'
        uses: actions/checkout@v4
        with:
          repository: google/mozc
          ref: ${{ needs.identify.outputs.commit }}
          path: third_party/mozc
          persist-credentials: false
      - name: Prepare build tools
        if: steps.existing.outputs.published != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential unzip
      - uses: actions/setup-java@v4
        if: steps.existing.outputs.published != 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        if: steps.existing.outputs.published != 'true'
        with:
          python-version: '3.12'
      - uses: bazelbuild/setup-bazelisk@v3
        if: steps.existing.outputs.published != 'true'
      - uses: actions/cache@v4
        if: steps.existing.outputs.published != 'true'
        with:
          path: third_party/mozc/src/third_party_cache
          key: mozc-deps-${{ runner.os }}-${{ needs.identify.outputs.tag }}
      - name: Build and verify pinned dependency
        if: steps.existing.outputs.published != 'true'
        run: |
          bash scripts/build-mozc-android.sh third_party/mozc/src
          python3 scripts/mozc_artifact.py package
      - name: Publish dependency without changing the latest app release
        if: steps.existing.outputs.published != 'true'
        run: |
          if ! gh release view "$MOZC_TAG" --json isDraft > "$RUNNER_TEMP/mozc-release.json"; then
            gh release create "$MOZC_TAG" --target "$GITHUB_SHA" --draft --prerelease --latest=false \
              --title "Mozc dependency $MOZC_TAG" \
              --notes "Pinned Mozc binary and dictionary. See manifest.json in the archive for provenance."
          else
            jq -e '.isDraft == true' "$RUNNER_TEMP/mozc-release.json" >/dev/null
          fi
          # Only drafts may be repaired on retry. Published assets are never overwritten.
          gh release upload "$MOZC_TAG" build/mozc/mozc-android.zip build/mozc/mozc-android.zip.sha256 --clobber
          gh release edit "$MOZC_TAG" --draft=false --prerelease --latest=false

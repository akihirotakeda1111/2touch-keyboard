name: Publish GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Validate public distribution repository and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          IS_PRIVATE="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')"
          if [ "$IS_PRIVATE" != "false" ]; then
            echo "GitHub Release updates require a public distribution repository." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){1,3}([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use a version such as v1.6.0." >&2
            exit 1
          fi

      - name: Validate release signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Read and validate app version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          chmod +x gradlew
          VERSION_INFO="$(./gradlew -q :app:printVersionInfo \
            -PUPDATE_REPOSITORY="$GITHUB_REPOSITORY")"
          IFS='|' read -r VERSION_CODE VERSION_NAME <<< "$VERSION_INFO"
          if [ "$RELEASE_TAG" != "v$VERSION_NAME" ]; then
            echo "Tag $RELEASE_TAG does not match app versionName $VERSION_NAME." >&2
            exit 1
          fi
          if [[ ! "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "versionCode must be a positive integer." >&2
            exit 1
          fi
          echo "version-code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version-name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Find valid Mozc artifact
        id: mozc-artifact
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listArtifactsForRepo({
              owner,
              repo,
              name: "mozc-android",
              per_page: 100,
            });
            const latest = response.data.artifacts
              .filter((artifact) => !artifact.expired)
              .sort(
                (left, right) =>
                  Date.parse(right.created_at) - Date.parse(left.created_at),
              )[0];
            if (!latest) {
              core.setOutput("found", "false");
              core.info("No valid mozc-android artifact found. Mozc will be built.");
              return;
            }
            core.setOutput("found", "true");
            core.setOutput("run-id", String(latest.workflow_run.id));

      - name: Download Mozc artifact
        if: steps.mozc-artifact.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          name: mozc-android
          run-id: ${{ steps.mozc-artifact.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: mozc-engine/src/main

      - name: Verify downloaded Mozc artifact
        if: steps.mozc-artifact.outputs.found == 'true'
        run: |
          test -f mozc-engine/src/main/jniLibs/arm64-v8a/libmozc.so
          test -f mozc-engine/src/main/assets/mozc.data

      - name: Checkout Mozc
        if: steps.mozc-artifact.outputs.found != 'true'
        uses: actions/checkout@v4
        with:
          repository: google/mozc
          path: third_party/mozc

      - name: Install system dependencies
        if: steps.mozc-artifact.outputs.found != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential unzip

      - name: Install Bazelisk
        if: steps.mozc-artifact.outputs.found != 'true'
        uses: bazelbuild/setup-bazelisk@v3

      - name: Restore Mozc dependency cache
        if: steps.mozc-artifact.outputs.found != 'true'
        uses: actions/cache@v4
        with:
          path: third_party/mozc/src/third_party_cache
          key: mozc-update-deps-${{ runner.os }}-${{ hashFiles('third_party/mozc/src/build_tools/update_deps.py') }}

      - name: Download Mozc build dependencies
        if: steps.mozc-artifact.outputs.found != 'true'
        working-directory: third_party/mozc/src
        run: python3 build_tools/update_deps.py

      - name: Build Mozc for Android
        if: steps.mozc-artifact.outputs.found != 'true'
        env:
          SKIP_UPDATE_DEPS: "1"
        run: |
          chmod +x scripts/build-mozc-android.sh
          ./scripts/build-mozc-android.sh third_party/mozc/src

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_FILE: ${{ runner.temp }}/2touch-release.jks
        run: printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"

      - name: Run tests and build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/2touch-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest assembleRelease --no-daemon \
            -PUPDATE_REPOSITORY="$GITHUB_REPOSITORY"

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Prepare immutable APK asset and SHA-256
        id: apk
        env:
          VERSION_NAME: ${{ steps.version.outputs.version-name }}
        run: |
          mkdir -p release-assets
          APK_NAME="app-$VERSION_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "release-assets/$APK_NAME"
          APK_SHA256="$(sha256sum "release-assets/$APK_NAME" | cut -d ' ' -f 1)"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"

      - name: Create or reuse draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
            if [ "$IS_DRAFT" != "true" ]; then
              echo "Release $RELEASE_TAG is already published." >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes "2Touch Keyboard $RELEASE_TAG"
          fi

      - name: Upload APK to draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          APK_NAME: ${{ steps.apk.outputs.name }}
        run: gh release upload "$RELEASE_TAG" "release-assets/$APK_NAME" --clobber

      - name: Generate latest.json
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION_CODE: ${{ steps.version.outputs.version-code }}
          VERSION_NAME: ${{ steps.version.outputs.version-name }}
          APK_NAME: ${{ steps.apk.outputs.name }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
        run: |
          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          APK_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$APK_NAME"
          jq -n \
            --argjson schemaVersion 1 \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "$APK_URL" \
            --arg sha256 "$APK_SHA256" \
            --arg publishedAt "$PUBLISHED_AT" \
            '{
              schemaVersion: $schemaVersion,
              versionCode: $versionCode,
              versionName: $versionName,
              apkUrl: $apkUrl,
              sha256: $sha256,
              publishedAt: $publishedAt
            }' > release-assets/latest.json
          jq -e '.schemaVersion == 1 and (.versionCode | type == "number")' \
            release-assets/latest.json >/dev/null

      - name: Upload latest.json to draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/latest.json --clobber

      - name: Verify draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          APK_NAME: ${{ steps.apk.outputs.name }}
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' \
            | grep -Fx "$APK_NAME"
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' \
            | grep -Fx latest.json

      - name: Publish complete Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/2touch-release.jks"

name: Publish GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate public distribution repository and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          IS_PRIVATE="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')"
          if [ "$IS_PRIVATE" != "false" ]; then
            echo "GitHub Release updates require a public distribution repository." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){1,3}([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use a version such as v1.6.0." >&2
            exit 1
          fi


  apk:
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/assemble-apk.yml
    with:
      build_type: release
      expected_tag: ${{ github.ref_name }}
    secrets: inherit

  release:
    needs: apk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download the tested and signed APK
        uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: app/build/outputs/apk/release
      - name: Prepare immutable APK asset and SHA-256
        id: apk
        env:
          VERSION_NAME: ${{ needs.apk.outputs.version-name }}
        run: |
          mkdir -p release-assets
          APK_NAME="app-$VERSION_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "release-assets/$APK_NAME"
          APK_SHA256="$(sha256sum "release-assets/$APK_NAME" | cut -d ' ' -f 1)"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"

      - name: Create or reuse draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
            if [ "$IS_DRAFT" != "true" ]; then
              echo "Release $RELEASE_TAG is already published." >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes "2Touch Keyboard $RELEASE_TAG"
          fi

      - name: Upload APK to draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          APK_NAME: ${{ steps.apk.outputs.name }}
        run: gh release upload "$RELEASE_TAG" "release-assets/$APK_NAME" --clobber

      - name: Generate latest.json
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION_CODE: ${{ needs.apk.outputs.version-code }}
          VERSION_NAME: ${{ needs.apk.outputs.version-name }}
          APK_NAME: ${{ steps.apk.outputs.name }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
        run: |
          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          APK_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$APK_NAME"
          jq -n \
            --argjson schemaVersion 1 \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "$APK_URL" \
            --arg sha256 "$APK_SHA256" \
            --arg publishedAt "$PUBLISHED_AT" \
            '{
              schemaVersion: $schemaVersion,
              versionCode: $versionCode,
              versionName: $versionName,
              apkUrl: $apkUrl,
              sha256: $sha256,
              publishedAt: $publishedAt
            }' > release-assets/latest.json
          jq -e '.schemaVersion == 1 and (.versionCode | type == "number")' \
            release-assets/latest.json >/dev/null

      - name: Upload latest.json to draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/latest.json --clobber

      - name: Verify draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          APK_NAME: ${{ steps.apk.outputs.name }}
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' \
            | grep -Fx "$APK_NAME"
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' \
            | grep -Fx latest.json

      - name: Publish complete Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

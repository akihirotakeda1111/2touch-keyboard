name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: APK build type
        required: true
        default: release
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read
  actions: read

concurrency:
  group: build-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Find valid Mozc artifact
        id: mozc-artifact
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listArtifactsForRepo({
              owner,
              repo,
              name: "mozc-android",
              per_page: 100,
            });
            const latest = response.data.artifacts
              .filter((artifact) => !artifact.expired)
              .sort(
                (left, right) =>
                  Date.parse(right.created_at) - Date.parse(left.created_at),
              )[0];
            if (!latest) {
              core.setOutput("found", "false");
              core.info("No valid mozc-android artifact found. Mozc will be built.");
              return;
            }
            core.setOutput("found", "true");
            core.setOutput("run-id", String(latest.workflow_run.id));
            core.info(
              `Using mozc-android from workflow run ${latest.workflow_run.id} ` +
                `(created ${latest.created_at}, expires ${latest.expires_at}).`,
            );

      - name: Download Mozc artifact
        if: steps.mozc-artifact.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          name: mozc-android
          run-id: ${{ steps.mozc-artifact.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: mozc-engine/src/main

      - name: Verify downloaded Mozc artifact
        if: steps.mozc-artifact.outputs.found == 'true'
        run: |
          test -f mozc-engine/src/main/jniLibs/arm64-v8a/libmozc.so
          test -f mozc-engine/src/main/assets/mozc.data

      - name: Checkout Mozc
        if: steps.mozc-artifact.outputs.found != 'true'
        uses: actions/checkout@v4
        with:
          repository: google/mozc
          path: third_party/mozc

      - name: Install system dependencies
        if: steps.mozc-artifact.outputs.found != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential unzip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Bazelisk
        if: steps.mozc-artifact.outputs.found != 'true'
        uses: bazelbuild/setup-bazelisk@v3

      - name: Restore Mozc dependency cache
        if: steps.mozc-artifact.outputs.found != 'true'
        uses: actions/cache@v4
        with:
          path: third_party/mozc/src/third_party_cache
          key: mozc-update-deps-${{ runner.os }}-${{ hashFiles('third_party/mozc/src/build_tools/update_deps.py') }}

      - name: Download Mozc build dependencies
        if: steps.mozc-artifact.outputs.found != 'true'
        working-directory: third_party/mozc/src
        run: python3 build_tools/update_deps.py

      - name: Build Mozc for Android
        if: steps.mozc-artifact.outputs.found != 'true'
        env:
          SKIP_UPDATE_DEPS: "1"
        run: |
          chmod +x scripts/build-mozc-android.sh
          ./scripts/build-mozc-android.sh third_party/mozc/src

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release signing secrets
        if: inputs.build_type == 'release'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"

      - name: Decode release keystore
        if: inputs.build_type == 'release'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_FILE: ${{ runner.temp }}/2touch-release.jks
        run: printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"

      - name: Build signed release APK
        if: inputs.build_type == 'release'
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/2touch-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PUPDATE_REPOSITORY="$GITHUB_REPOSITORY"

      - name: Verify release APK signature
        if: inputs.build_type == 'release'
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Build debug APK
        if: inputs.build_type == 'debug'
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon \
            -PUPDATE_REPOSITORY="$GITHUB_REPOSITORY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 2touch-keyboard-${{ inputs.build_type }}-${{ github.run_number }}
          path: app/build/outputs/apk/${{ inputs.build_type }}/*.apk
          if-no-files-found: error

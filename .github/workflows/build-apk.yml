name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: APK build type
        required: true
        default: release
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout Mozc
        uses: actions/checkout@v4
        with:
          repository: google/mozc
          path: third_party/mozc

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential unzip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Restore Mozc dependency cache
        uses: actions/cache@v4
        with:
          path: third_party/mozc/src/third_party_cache
          key: mozc-update-deps-${{ runner.os }}-${{ hashFiles('third_party/mozc/src/build_tools/update_deps.py') }}

      - name: Download Mozc build dependencies
        working-directory: third_party/mozc/src
        run: python3 build_tools/update_deps.py

      - name: Build Mozc for Android
        env:
          SKIP_UPDATE_DEPS: "1"
        run: |
          chmod +x scripts/build-mozc-android.sh
          ./scripts/build-mozc-android.sh third_party/mozc/src

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          if [ "${{ inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 2touch-keyboard-${{ inputs.build_type }}-${{ github.run_number }}
          path: app/build/outputs/apk/${{ inputs.build_type }}/*.apk
          if-no-files-found: error

name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: APK build type
        required: true
        default: release
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read
  actions: read

concurrency:
  group: build-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    uses: ./.github/workflows/assemble-apk.yml
    with:
      build_type: ${{ inputs.build_type }}
    secrets: inherit
